<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Lab</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe3f2;font-family:system-ui,sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(#9fd3ea,#dff2f8)}
  #scene{width:100%;height:100%;transition:transform 1.8s cubic-bezier(.6,0,.9,.4);transform-origin:36.7% 71.4%}
  #scene.zoom{transform:scale(14)}
  #door{cursor:pointer}
  #door .glass{transition:fill .25s}
  #door:hover .glass,#door:focus .glass{fill:#bff4ff}
  #door:focus{outline:none}
  #hint{animation:pulse 1.6s ease-in-out infinite;pointer-events:none}
  @keyframes pulse{50%{opacity:.35}}
  .leg{transform-box:fill-box;transform-origin:50% 0;animation:swing .7s ease-in-out infinite alternate}
  .leg.b{animation-direction:alternate-reverse}
  @keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
  .cloud{animation:drift 60s linear infinite}
  @keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
  #fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .9s ease-in}
  #fade.on{opacity:1;transition-delay:1.1s}
  #titleX{position:fixed;top:14px;left:0;right:0;text-align:center;color:#2a5a6e;letter-spacing:.3em;
    font-weight:600;font-size:14px;transition:opacity .4s;pointer-events:none}
  

  #m-scene{display:none;width:100%;height:100%;transition:transform 1.8s cubic-bezier(.6,0,.9,.4);transform-origin:50% 62%}
  #m-scene.zoom{transform:scale(10)}
  #mdoor{cursor:pointer}
  #mdoor:focus{outline:none}
  @media (max-width:700px){#scene{display:none}#m-scene{display:block}}
  #intro{position:fixed;inset:0;background:#000;z-index:10;display:flex;align-items:center;justify-content:center;
    transition:opacity 1.2s ease;cursor:pointer}
  #intro.out{opacity:0;pointer-events:none}
  #logo{color:#fff;font-size:clamp(40px,11vw,96px);font-weight:700;letter-spacing:.04em;display:flex;white-space:pre;
    filter:blur(22px);opacity:0;transition:filter 2s ease,opacity 2s ease}
  #logo.clear{filter:blur(0);opacity:1}
  #logo .nang{display:inline-block;overflow:hidden;max-width:0;opacity:0;color:#6c7cff;
    transition:max-width 1.1s ease,opacity 1.1s ease}
  #logo.full .nang{max-width:2.6em;opacity:1}

  .bird{animation:fly 26s linear infinite}
  @keyframes fly{from{transform:translate(-200px,0)}to{transform:translate(1500px,-30px)}}
  .wing{transform-box:fill-box;transform-origin:50% 100%;animation:flap .45s ease-in-out infinite alternate}
  @keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.6)}}
  .flag{transform-box:fill-box;transform-origin:0 50%;animation:wave 1.4s ease-in-out infinite alternate}
  @keyframes wave{from{transform:skewY(-6deg) scaleX(1)}to{transform:skewY(6deg) scaleX(.85)}}
  .lamp{animation:glow 3s ease-in-out infinite alternate}
  @keyframes glow{from{opacity:.55}to{opacity:1}}
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" style="overflow:visible" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" aria-label="Low poly building">
    <!-- sky clouds -->
    <g fill="#fff" opacity=".8">
      <g class="cloud"><polygon points="100,90 140,60 190,70 230,90 190,105 140,105"/></g>
      <g class="cloud" style="animation-delay:-30s"><polygon points="500,60 540,38 590,48 625,64 585,78 535,78"/></g>
    </g>
    <g fill="#fff" opacity=".7">
      <g class="cloud" style="animation-delay:-12s"><polygon points="800,120 835,98 880,106 910,122 872,136 830,136"/></g>
      <g class="cloud" style="animation-delay:-45s"><polygon points="300,30 335,12 380,20 410,34 372,46 330,46"/></g>
      <g class="cloud" style="animation-delay:-22s"><polygon points="950,40 980,24 1020,30 1048,44 1012,54 975,54"/></g>
    </g>
    <!-- hills -->
    <polygon points="-1500,560 -1500,400 -900,330 -500,420 -100,300 250,400 600,350 1000,290 1400,390 1800,320 2200,400 2700,350 2700,560" fill="#b3d9d0"/>
    <polygon points="-100,300 250,400 100,560 -300,560" fill="#a2cdc3"/>
    <polygon points="1000,290 1400,390 1300,560 900,560" fill="#a2cdc3"/>
    <polygon points="-1500,560 -1500,470 -1000,430 -600,490 -200,440 100,500 450,460 800,420 1150,480 1500,430 1900,490 2300,440 2700,480 2700,560" fill="#8fc3a8"/>
    <polygon points="-200,440 100,500 0,560 -300,560" fill="#7fb799"/>
    <polygon points="1150,480 1500,430 1600,560 1250,560" fill="#7fb799"/>
    <!-- birds -->
    <g class="bird" style="animation-delay:-3s" fill="#4a5f6e"><g class="wing"><polygon points="0,100 -9,92 -16,100 -8,98"/><polygon points="0,100 9,92 16,100 8,98"/></g></g>
    <g class="bird" style="animation-delay:-5s;animation-duration:32s" fill="#4a5f6e"><g class="wing"><polygon points="40,150 31,142 24,150 32,148"/><polygon points="40,150 49,142 56,150 48,148"/></g></g>
    <g class="bird" style="animation-delay:-14s;animation-duration:29s" fill="#4a5f6e"><g class="wing"><polygon points="0,60 -9,52 -16,60 -8,58"/><polygon points="0,60 9,52 16,60 8,58"/></g></g>
    <!-- left tower -->
    <polygon points="150,150 330,120 330,560 150,560" fill="#f4f6f8"/>
    <polygon points="150,150 240,135 240,560 150,560" fill="#e3e8ec"/>
    <!-- blue glass curved tower -->
    <polygon points="185,260 245,240 245,560 185,560" fill="#4ea8d4"/>
    <polygon points="245,240 305,260 305,560 245,560" fill="#2f86b8"/>
    <polygon points="185,260 245,240 215,400" fill="#7cc4e6"/>
    <polygon points="245,240 305,260 275,400" fill="#5ab2dc"/>
    <polygon points="215,400 275,400 245,560" fill="#3d97c8" opacity=".6"/>
    <!-- red panel -->
    <polygon points="330,160 440,150 440,330 330,330" fill="#e2503f"/>
    <polygon points="330,160 385,155 330,330" fill="#f26d5a"/>
    <polygon points="385,155 440,150 440,330" fill="#c63b2d"/>
    <!-- central white mass -->
    <polygon points="330,200 640,190 640,560 330,560" fill="#f7f8fa"/>
    <polygon points="440,150 640,190 440,330" fill="#dfe5ea"/>
    <polygon points="440,330 640,190 640,330" fill="#eef1f4"/>
    <!-- upper glass strip -->
    <polygon points="450,340 630,340 630,390 450,390" fill="#6fbbe0"/>
    <polygon points="450,340 540,340 495,390 450,390" fill="#9ad4ee"/>
    <!-- right wing -->
    <polygon points="640,190 1050,160 1050,560 640,560" fill="#f1f3f6"/>
    <!-- wood/orange band -->
    <polygon points="640,190 1050,120 1050,230 640,250" fill="#d9794a"/>
    <polygon points="640,190 780,166 700,250 640,250" fill="#f09560"/>
    <polygon points="780,166 920,142 860,240 700,250" fill="#b8613a"/>
    <polygon points="920,142 1050,120 1050,230 860,240" fill="#e68a56"/>
    <polygon points="640,250 1050,230 1050,262 640,280" fill="#7d8a96"/>
    <!-- angular blue windows -->
    <g>
      <polygon points="670,300 760,285 760,420 670,420" fill="#3f9ccb"/>
      <polygon points="670,300 760,285 670,420" fill="#7ac3e6"/>
      <polygon points="790,285 880,300 880,420 790,420" fill="#2f86b8"/>
      <polygon points="790,285 880,300 790,420" fill="#5ab2dc"/>
      <polygon points="910,300 1010,285 1010,420 910,420" fill="#3f9ccb"/>
      <polygon points="910,300 1010,285 910,420" fill="#7ac3e6"/>
    </g>
    <!-- side entrance (dark) -->
    <polygon points="900,440 985,440 985,560 900,560" fill="#3a4651"/>
    <polygon points="900,440 942,440 900,560" fill="#4d5b68"/>
    <!-- canopy + columns -->
    <polygon points="260,395 570,395 610,425 220,425" fill="#27b8c9"/>
    <polygon points="260,395 570,395 540,405 290,405" fill="#6fe0ea"/>
    <polygon points="220,425 610,425 610,436 220,436" fill="#168a9b"/>
    <polygon points="318,436 332,436 332,560 318,560" fill="#1ea0b2"/>
    <polygon points="540,436 554,436 554,560 540,560" fill="#168a9b"/>
    <!-- door (clickable) -->
    <g id="door" tabindex="0" role="button" aria-label="Enter the building">
      <polygon points="372,445 508,445 508,560 372,560" fill="#2c3e4a"/>
      <polygon class="glass" points="380,452 436,452 436,560 380,560" fill="#8fdcee"/>
      <polygon class="glass" points="444,452 500,452 500,560 444,560" fill="#8fdcee"/>
      <polygon points="380,452 436,452 380,520" fill="#fff" opacity=".35"/>
      <polygon points="444,452 500,452 444,520" fill="#fff" opacity=".35"/>
      <rect x="430" y="500" width="4" height="22" fill="#2c3e4a"/><rect x="446" y="500" width="4" height="22" fill="#2c3e4a"/>
      <text id="hint" x="440" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">&#9660; ENTER</text>
    </g>
    <!-- ground -->
    <polygon points="-1500,560 2700,560 2700,640 -1500,640" fill="#e9dfcf"/>
    <polygon points="-1500,560 600,560 400,640 -1500,640" fill="#f2eadc"/>
    <polygon points="-1500,640 2700,640 2700,1200 -1500,1200" fill="#4b5560"/>
    <polygon points="-1500,640 2700,640 2700,648 -1500,648" fill="#fff"/>
    <polygon points="-1500,640 500,640 300,700 -1500,700" fill="#59646f"/>
    <!-- bushes -->
    <polygon points="250,560 275,540 305,545 312,560" fill="#3e9d5a"/>
    <polygon points="580,560 605,542 640,548 650,560" fill="#2f8a4b"/>
    <g id="decor">
      <!-- flagpole -->
      <polygon points="1118,330 1122,330 1122,562 1118,562" fill="#8a96a0"/>
      <polygon class="flag" points="1122,334 1168,342 1122,360" fill="#e2503f"/>
      <polygon class="flag" points="1122,360 1168,342 1168,352 1122,368" fill="#f4f6f8" style="animation-delay:-.4s"/>
      <!-- bench -->
      <polygon points="760,572 820,572 820,578 760,578" fill="#b8764a"/>
      <polygon points="760,560 820,560 820,568 760,568" fill="#d9915f"/>
      <polygon points="764,578 768,578 768,588 764,588" fill="#4a5560"/><polygon points="812,578 816,578 816,588 812,588" fill="#4a5560"/>
      <!-- lamp posts -->
      <g><polygon points="94,430 98,430 98,572 94,572" fill="#4a5560"/><polygon points="84,424 108,424 102,436 90,436" fill="#4a5560"/><polygon class="lamp" points="88,436 104,436 100,446 92,446" fill="#ffe9a0"/></g>
      <g><polygon points="654,440 658,440 658,574 654,574" fill="#4a5560"/><polygon points="644,434 668,434 662,446 650,446" fill="#4a5560"/><polygon class="lamp" points="648,446 664,446 660,456 652,456" fill="#ffe9a0"/></g>
      <g><polygon points="1038,440 1042,440 1042,574 1038,574" fill="#4a5560"/><polygon points="1028,434 1052,434 1046,446 1034,446" fill="#4a5560"/><polygon class="lamp" points="1032,446 1048,446 1044,456 1036,456" fill="#ffe9a0"/></g>
    </g>
    <g id="npcs"></g>
  </svg>
  <svg id="m-scene" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice" aria-label="Low poly door">
    <polygon points="0,0 400,0 400,700 0,700" fill="#f4f6f8"/>
    <polygon points="0,0 160,0 0,300" fill="#e3e8ec"/>
    <polygon points="400,0 400,380 240,0" fill="#eaeef2"/>
    <polygon points="0,150 400,150 400,230 0,230" fill="#6fbbe0"/>
    <polygon points="0,150 200,150 120,230 0,230" fill="#9ad4ee"/>
    <polygon points="0,260 400,260 440,300 -40,300" fill="#27b8c9"/>
    <polygon points="0,260 400,260 330,275 70,275" fill="#6fe0ea"/>
    <polygon points="-40,300 440,300 440,314 -40,314" fill="#168a9b"/>
    <polygon points="30,314 52,314 52,540 30,540" fill="#1ea0b2"/>
    <polygon points="348,314 370,314 370,540 348,540" fill="#168a9b"/>
    <g id="mdoor" tabindex="0" role="button" aria-label="Enter">
      <polygon points="100,330 300,330 300,540 100,540" fill="#2c3e4a"/>
      <polygon class="glass" points="112,342 194,342 194,540 112,540" fill="#8fdcee"/>
      <polygon class="glass" points="206,342 288,342 288,540 206,540" fill="#8fdcee"/>
      <polygon points="112,342 194,342 112,450" fill="#fff" opacity=".35"/>
      <polygon points="206,342 288,342 206,450" fill="#fff" opacity=".35"/>
      <rect x="184" y="430" width="6" height="34" fill="#2c3e4a"/><rect x="210" y="430" width="6" height="34" fill="#2c3e4a"/>
      <text class="hint" x="200" y="318" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="system-ui,sans-serif" style="pointer-events:none;animation:pulse 1.6s ease-in-out infinite">&#9660; ENTER</text>
    </g>
    <polygon points="-40,540 440,540 440,700 -40,700" fill="#e9dfcf"/>
    <polygon points="-40,540 260,540 140,700 -40,700" fill="#f2eadc"/>
    <polygon points="0,540 60,515 110,540" fill="#3e9d5a"/><polygon points="300,540 350,512 400,540" fill="#2f8a4b"/>
  </svg>
</div>
<div id="intro"><div id="logo"><span>A</span><span class="nang">nang</span><span> Lab</span></div></div>
<div id="fade"></div>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg', npcs=document.getElementById('npcs'), students=[];
  var shirts=['#e2503f','#3f9ccb','#f2c14e','#7bc47f','#9b72cf','#f08a4b'];
  var skins=['#f1c9a5','#d9a273','#a8744a','#8a5a38'];
  function poly(p,f){var e=document.createElementNS(NS,'polygon');e.setAttribute('points',p);e.setAttribute('fill',f);return e}
  function make(i){
    var g=document.createElementNS(NS,'g'), inner=document.createElementNS(NS,'g');
    var shirt=shirts[i%shirts.length], skin=skins[(i*3)%skins.length];
    var l1=document.createElementNS(NS,'g'),l2=document.createElementNS(NS,'g');
    l1.setAttribute('class','leg');l2.setAttribute('class','leg b');
    l1.appendChild(poly('-5,0 0,0 -1,22 -6,22','#2d3a66'));
    l2.appendChild(poly('0,0 5,0 6,22 1,22','#25305a'));
    var body=poly('-8,-26 8,-26 6,0 -6,0',shirt), shade=poly('0,-26 8,-26 6,0 0,0','rgba(0,0,0,.18)');
    var head=poly('-6,-40 0,-44 6,-40 6,-32 0,-28 -6,-32',skin);
    var hair=poly('-6,-40 0,-44 6,-40 0,-37','#3b2a20');
    [l1,l2,body,shade,head,hair].forEach(function(e){inner.appendChild(e)});
    g.appendChild(inner); npcs.appendChild(g);
    var y=582+Math.random()*50, dir=i%2?1:-1;
    return {g:g,inner:inner,y:y,x:Math.random()*1200,dir:dir,v:(.35+Math.random()*.5)}
  }

  // trees (low poly) and road vehicles
  var decor=document.getElementById('decor');
  function tree(x,sc,pine){
    var g=document.createElementNS(NS,'g');
    g.setAttribute('transform','translate('+x+' 560) scale('+sc+')');
    g.appendChild(poly('-6,0 6,0 5,-50 -5,-50','#7a5a40'));
    g.appendChild(poly('0,0 6,0 5,-50 0,-50','#6a4c35'));
    if(pine){
      [[-95,48,'#2f8a4b','#277a40'],[-65,40,'#38a05a','#2f8a4b'],[-38,30,'#43b068','#38a05a']].forEach(function(t){
        g.appendChild(poly((-t[1])+','+(t[0]+50)+' 0,'+(t[0]-34)+' 0,'+(t[0]+50),t[2]));
        g.appendChild(poly('0,'+(t[0]-34)+' '+t[1]+','+(t[0]+50)+' 0,'+(t[0]+50),t[3]));
      });
    }else{
      g.appendChild(poly('-34,-62 -22,-104 0,-120 0,-50','#4fb36c'));
      g.appendChild(poly('0,-120 24,-104 36,-62 0,-50','#3c9a58'));
      g.appendChild(poly('-34,-62 0,-50 0,-30 -26,-44','#3c9a58'));
      g.appendChild(poly('0,-50 36,-62 28,-44 0,-30','#2f8a4b'));
    }
    decor.insertBefore(g,decor.firstChild);
  }
  [[-420,1.5,1],[-300,1.2,0],[-230,1.6,1],[-110,1.1,0],[30,1.25,1],[1190,1.3,0],[1290,1.5,1],[1420,1.2,0],[1560,1.6,1]].forEach(function(t){tree(t[0],t[1],t[2])});

  function wheel(cx,cy,r){
    var g=document.createElementNS(NS,'g');
    g.appendChild(poly((cx-r)+','+(cy-r/2)+' '+(cx-r/2)+','+(cy-r)+' '+(cx+r/2)+','+(cy-r)+' '+(cx+r)+','+(cy-r/2)+' '+(cx+r)+','+(cy+r/2)+' '+(cx+r/2)+','+(cy+r)+' '+(cx-r/2)+','+(cy+r)+' '+(cx-r)+','+(cy+r/2),'#2b323a'));
    g.appendChild(poly((cx-r/3)+','+(cy-r/3)+' '+(cx+r/3)+','+(cy-r/3)+' '+(cx+r/3)+','+(cy+r/3)+' '+(cx-r/3)+','+(cy+r/3),'#9aa5ae'));
    return g;
  }
  function bus(){
    var g=document.createElementNS(NS,'g');
    g.appendChild(poly('0,0 150,0 156,12 156,40 0,40','#f2c14e'));
    g.appendChild(poly('0,0 150,0 156,12 0,12','#f7d77a'));
    g.appendChild(poly('0,26 156,26 156,40 0,40','#d9a53a'));
    for(var i=0;i<5;i++) g.appendChild(poly((8+i*26)+',6 '+(28+i*26)+',6 '+(28+i*26)+',22 '+(8+i*26)+',22','#7cc4e6'));
    g.appendChild(poly('138,6 152,10 152,22 138,22','#a8dcf2'));
    g.appendChild(wheel(32,42,9)); g.appendChild(wheel(120,42,9));
    return g;
  }
  function moto(){
    var g=document.createElementNS(NS,'g');
    g.appendChild(wheel(10,22,8)); g.appendChild(wheel(46,22,8));
    g.appendChild(poly('8,10 24,12 40,8 46,20 14,20','#e2503f'));
    g.appendChild(poly('24,12 40,8 46,20 30,18','#c63b2d'));
    g.appendChild(poly('22,2 30,2 31,12 20,12','#3f9ccb'));
    g.appendChild(poly('22,-8 29,-8 30,-2 22,-2','#f1c9a5'));
    return g;
  }
  var vehicles=[];
  function addVehicle(kind,y,dir,v,x){
    var g=document.createElementNS(NS,'g'); g.appendChild(kind==='bus'?bus():moto()); decor.appendChild(g);
    vehicles.push({g:g,y:y,dir:dir,v:v,x:x,w:kind==='bus'?156:56});
  }
  addVehicle('bus',652,1,1.5,100);
  addVehicle('moto',668,-1,2.6,900);
  addVehicle('moto',672,1,2.2,-300);
  addVehicle('bus',680,-1,1.2,1500);
  for(var i=0;i<9;i++) students.push(make(i));
  var last=performance.now();
  function tick(t){
    var dt=Math.min(40,t-last)/16; last=t;
    students.forEach(function(s){
      s.x+=s.dir*s.v*dt;
      if(s.x>1260) s.x=-60; if(s.x<-60) s.x=1260;
      var sc=.9+(s.y-580)/200;
      s.g.setAttribute('transform','translate('+s.x+' '+(s.y+10)+') scale('+(s.dir*sc)+' '+sc+')');
    });
    vehicles.forEach(function(c){
      c.x+=c.dir*c.v*dt;
      if(c.dir>0&&c.x>1500) c.x=-300; if(c.dir<0&&c.x<-300) c.x=1500;
      c.g.setAttribute('transform','translate('+(c.dir>0?c.x:c.x+c.w)+' '+c.y+') scale('+c.dir+' 1)');
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  var going=false;
  function enter(){
    if(going) return; going=true;
    var mobile=window.matchMedia('(max-width:700px)').matches;
    document.getElementById(mobile?'m-scene':'scene').classList.add('zoom');
    document.getElementById('fade').classList.add('on');
    setTimeout(function(){location.href='magazine.html'},2200);
  }
  ['door','mdoor'].forEach(function(id){
    var d=document.getElementById(id);
    d.addEventListener('click',enter);
    d.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')enter()});
  });
  // intro: blurry "A Lab" -> clear -> "Anang Lab" -> fade to the building
  var intro=document.getElementById('intro'), logo=document.getElementById('logo'), seen=false;
  try{seen=sessionStorage.getItem('introSeen')==='1'}catch(e){}
  function endIntro(){
    intro.classList.add('out');
    try{sessionStorage.setItem('introSeen','1')}catch(e){}
    setTimeout(function(){intro.style.display='none'},1300);
  }
  if(seen){intro.style.display='none'}
  else{
    setTimeout(function(){logo.classList.add('clear')},150);
    setTimeout(function(){logo.classList.add('full')},3000);
    setTimeout(endIntro,5200);
    intro.addEventListener('click',endIntro);
  }
})();
</script>
</body>
</html>
