<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pemrograman Linier Ditingkatkan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .constraint-card {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="container bg-white p-8 rounded-2xl shadow-lg w-full max-w-4xl">
        <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Kalkulator Pemrograman Linier</h2>

        <!-- Objective Function Section -->
        <div class="space-y-4 mb-8">
            <h3 class="text-xl font-semibold text-gray-700">Fungsi Tujuan: Maksimalkan Z = Px + Qy</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 bg-gray-50 rounded-lg">
                <div class="flex flex-col">
                    <label for="p-coeff" class="text-sm font-medium text-gray-600 mb-1">Koefisien P (untuk X):</label>
                    <input type="number" id="p-coeff" value="4000000" required class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex flex-col">
                    <label for="q-coeff" class="text-sm font-medium text-gray-600 mb-1">Koefisien Q (untuk Y):</label>
                    <input type="number" id="q-coeff" value="6000000" required class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
        </div>

        <!-- Constraints Section -->
        <div class="space-y-4 mb-6">
            <h3 class="text-xl font-semibold text-gray-700">Batasan (Ax + By &le; C)</h3>
            <div id="constraints-container" class="space-y-4">
                <!-- Constraints will be dynamically added here -->
            </div>
            <button id="add-constraint-btn" type="button" class="w-full mt-4 bg-gray-200 text-gray-700 font-bold py-3 px-6 rounded-lg shadow-sm hover:bg-gray-300 transition-colors duration-300">
                + Tambah Batasan
            </button>
        </div>

        <button id="calculate-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-300">Hitung Solusi Optimal</button>

        <div id="results-container" class="mt-8 opacity-0 transition-opacity duration-500">
            <h3 class="text-2xl font-bold mb-4 text-center text-gray-800">Hasil Analisis</h3>
            <div id="summary-result" class="text-center text-lg p-4 mb-6 bg-green-50 rounded-lg"></div>
            
            <h4 class="text-xl font-semibold text-gray-700 mb-2">Evaluasi Titik Sudut</h4>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border rounded-lg">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-2 px-4 border-b text-left">Titik Sudut (X, Y)</th>
                            <th class="py-2 px-4 border-b text-left">Perhitungan Z</th>
                            <th class="py-2 px-4 border-b text-left">Hasil Z</th>
                        </tr>
                    </thead>
                    <tbody id="vertices-table-body">
                        <!-- Vertex evaluations will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>

        <div id="graph" class="mt-8"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const constraintsContainer = document.getElementById('constraints-container');
            const addConstraintBtn = document.getElementById('add-constraint-btn');
            const calculateBtn = document.getElementById('calculate-btn');

            let constraintCount = 0;

            // Function to add a new constraint input group
            const addConstraint = (a = '', b = '', c = '') => {
                constraintCount++;
                const constraintId = `constraint-${constraintCount}`;
                const constraintCard = document.createElement('div');
                constraintCard.classList.add('grid', 'grid-cols-1', 'md:grid-cols-7', 'gap-4', 'p-4', 'border', 'rounded-lg', 'bg-white', 'shadow-sm', 'constraint-card');
                constraintCard.id = constraintId;

                constraintCard.innerHTML = `
                    <div class="flex flex-col md:col-span-2">
                        <label class="text-sm font-medium text-gray-600 mb-1">Koefisien A (X):</label>
                        <input type="number" value="${a}" class="a-coeff p-2 border border-gray-300 rounded-lg" placeholder="A" required>
                    </div>
                    <div class="flex flex-col md:col-span-2">
                        <label class="text-sm font-medium text-gray-600 mb-1">Koefisien B (Y):</label>
                        <input type="number" value="${b}" class="b-coeff p-2 border border-gray-300 rounded-lg" placeholder="B" required>
                    </div>
                    <div class="text-center self-center text-2xl text-gray-400 pt-6 hidden md:block">&le;</div>
                    <div class="flex flex-col md:col-span-2">
                        <label class="text-sm font-medium text-gray-600 mb-1">Batas C:</label>
                        <input type="number" value="${c}" class="c-coeff p-2 border border-gray-300 rounded-lg" placeholder="C" required>
                    </div>
                    <div class="flex items-end justify-center">
                        <button type="button" class="remove-constraint-btn bg-red-500 text-white w-10 h-10 rounded-lg hover:bg-red-600 transition-colors">&times;</button>
                    </div>
                `;
                constraintsContainer.appendChild(constraintCard);

                constraintCard.querySelector('.remove-constraint-btn').addEventListener('click', () => {
                    constraintCard.remove();
                });
            };
            
            // Add initial constraints from the original problem
            addConstraint(1, 1, 50);
            addConstraint(30, 60, 2400);

            addConstraintBtn.addEventListener('click', () => addConstraint());

            calculateBtn.addEventListener('click', () => {
                // 1. Get coefficients from inputs
                const p = parseFloat(document.getElementById('p-coeff').value);
                const q = parseFloat(document.getElementById('q-coeff').value);
                
                const constraints = [];
                document.querySelectorAll('.constraint-card').forEach(card => {
                    const a = parseFloat(card.querySelector('.a-coeff').value);
                    const b = parseFloat(card.querySelector('.b-coeff').value);
                    const c = parseFloat(card.querySelector('.c-coeff').value);
                    if (!isNaN(a) && !isNaN(b) && !isNaN(c)) {
                        constraints.push({ a, b, c });
                    }
                });

                if (constraints.length < 1 || isNaN(p) || isNaN(q)) {
                    alert("Harap isi semua koefisien fungsi tujuan dan setidaknya satu batasan.");
                    return;
                }

                // 2. Find all potential vertices
                let vertices = new Set();
                vertices.add(JSON.stringify([0, 0])); // Origin

                // Intercepts with axes
                constraints.forEach(cons => {
                    if (cons.a !== 0) {
                        const xIntercept = [cons.c / cons.a, 0];
                        if (xIntercept[0] >= 0) vertices.add(JSON.stringify(xIntercept));
                    }
                    if (cons.b !== 0) {
                        const yIntercept = [0, cons.c / cons.b];
                        if (yIntercept[1] >= 0) vertices.add(JSON.stringify(yIntercept));
                    }
                });
                
                // Intersections of every pair of constraint lines
                for (let i = 0; i < constraints.length; i++) {
                    for (let j = i + 1; j < constraints.length; j++) {
                        const c1 = constraints[i];
                        const c2 = constraints[j];
                        const det = c1.a * c2.b - c2.a * c1.b;
                        if (det !== 0) {
                            const x = (c2.b * c1.c - c1.b * c2.c) / det;
                            const y = (c1.a * c2.c - c2.a * c1.c) / det;
                            if (x >= -1e-9 && y >= -1e-9) { // Use tolerance for floating point
                                vertices.add(JSON.stringify([x, y]));
                            }
                        }
                    }
                }

                // 3. Filter for valid vertices (must satisfy ALL constraints)
                const feasibleVertices = Array.from(vertices)
                    .map(JSON.parse)
                    .filter(point => {
                        const [x, y] = point;
                        return constraints.every(cons => (cons.a * x + cons.b * y) <= cons.c + 1e-9); // Tolerance
                    });
                
                // Remove duplicates with tolerance
                const uniqueFeasibleVertices = feasibleVertices.filter((v, i, self) =>
                    i === self.findIndex(p => Math.abs(p[0] - v[0]) < 1e-9 && Math.abs(p[1] - v[1]) < 1e-9)
                );


                // 4. Evaluate objective function at each feasible vertex
                if (uniqueFeasibleVertices.length === 0) {
                    document.getElementById('summary-result').innerHTML = `<span class="text-red-600 font-bold">Tidak ditemukan solusi yang layak.</span>`;
                    return;
                }
                
                let maxZ = -Infinity;
                let bestPoint = null;
                const evaluations = [];

                uniqueFeasibleVertices.forEach(point => {
                    const [x, y] = point;
                    const z = p * x + q * y;
                    evaluations.push({ point, z });
                    if (z > maxZ) {
                        maxZ = z;
                        bestPoint = point;
                    }
                });
                
                // 5. Display results
                document.getElementById('results-container').classList.remove('opacity-0');

                // Summary
                const summaryDiv = document.getElementById('summary-result');
                summaryDiv.innerHTML = `
                    Keuntungan maksimum: <strong class="text-green-600">Rp${maxZ.toLocaleString('id-ID', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</strong><br>
                    Dicapai pada: <strong class="text-blue-600">X: ${bestPoint[0].toFixed(2)}</strong> dan <strong class="text-blue-600">Y: ${bestPoint[1].toFixed(2)}</strong>.
                `;

                // Table
                const tableBody = document.getElementById('vertices-table-body');
                tableBody.innerHTML = '';
                evaluations.sort((a,b) => b.z - a.z).forEach(({ point, z }) => {
                    const isOptimal = (z === maxZ);
                    const row = document.createElement('tr');
                    row.className = isOptimal ? 'bg-green-100 font-bold' : '';
                    row.innerHTML = `
                        <td class="py-2 px-4 border-b">(${point[0].toFixed(2)}, ${point[1].toFixed(2)})</td>
                        <td class="py-2 px-4 border-b">${p.toLocaleString()} * ${point[0].toFixed(2)} + ${q.toLocaleString()} * ${point[1].toFixed(2)}</td>
                        <td class="py-2 px-4 border-b">${z.toLocaleString('id-ID', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    `;
                    tableBody.appendChild(row);
                });

                // 6. Draw Graph
                const data = [];
                let maxX = 0;
                let maxY = 0;

                // Add constraint lines
                constraints.forEach((cons, i) => {
                    let x_intercept = cons.a !== 0 ? cons.c / cons.a : Infinity;
                    let y_intercept = cons.b !== 0 ? cons.c / cons.b : Infinity;
                    maxX = Math.max(maxX, x_intercept);
                    maxY = Math.max(maxY, y_intercept);
                    data.push({
                        x: [x_intercept, 0],
                        y: [0, y_intercept],
                        mode: 'lines',
                        name: `Batasan ${i+1}`
                    });
                });

                // Add feasible region polygon
                if (uniqueFeasibleVertices.length > 1) {
                    // Sort vertices to draw polygon correctly
                    const centroid = uniqueFeasibleVertices.reduce((acc, p) => [acc[0] + p[0], acc[1] + p[1]], [0, 0]);
                    centroid[0] /= uniqueFeasibleVertices.length;
                    centroid[1] /= uniqueFeasibleVertices.length;
                    uniqueFeasibleVertices.sort((a, b) => {
                        return Math.atan2(a[1] - centroid[1], a[0] - centroid[0]) - Math.atan2(b[1] - centroid[1], b[0] - centroid[0]);
                    });
                    
                    data.unshift({
                        x: uniqueFeasibleVertices.map(v => v[0]).concat(uniqueFeasibleVertices[0][0]),
                        y: uniqueFeasibleVertices.map(v => v[1]).concat(uniqueFeasibleVertices[0][1]),
                        fill: 'toself',
                        fillcolor: 'rgba(0,176,246,0.2)',
                        line: { color: 'transparent' },
                        name: 'Daerah Layak'
                    });
                }
                
                // Add best point marker
                data.push({
                    x: [bestPoint[0]],
                    y: [bestPoint[1]],
                    mode: 'markers',
                    name: 'Titik Optimal',
                    marker: { color: 'red', size: 12, symbol: 'star' }
                });

                const layout = {
                    title: 'Grafik Batasan dan Solusi Optimal',
                    xaxis: { title: 'Variabel X', range: [0, Math.max(...uniqueFeasibleVertices.map(v => v[0])) * 1.2 + 10] },
                    yaxis: { title: 'Variabel Y', range: [0, Math.max(...uniqueFeasibleVertices.map(v => v[1])) * 1.2 + 10] }
                };
                
                Plotly.newPlot('graph', data, layout);

            });

            // Trigger initial calculation on load
            calculateBtn.click();
        });
    </script>
</body>
</html>
